<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIBUT 2026 · Disc-o-tech</title>
<style>
/* =============================================================
   RIBUT 2026 — Y2K theme.
   Neon palette sampled from the Player Guide artwork; navy + logo
   from the tournament badge. Logo: assets/logo.png
   ============================================================= */
:root {
  --aqua:     #14FFEE;   /* electric aqua  (guide p12)             */
  --magenta:  #E658B3;   /* hot magenta    (guide cover)           */
  --lime:     #C1EF6F;   /* lime           (guide p3)              */
  --blue:     #4E5FF0;   /* electric blue  (guide p5)              */
  --brand:    var(--aqua);
  --brand-2:  var(--magenta);
  --bg:       #070E1A;
  --panel:    #0E1F33;
  --navy:     #142F3B;   /* badge navy                             */
  --text:     #F2F7FF;
  --muted:    #7FC9D8;
  /* chart colours (read by plot.js / kiosk.js) */
  --plot-bg:  #061019;
  --series-1: #14FFEE;
  --series-2: #E658B3;
  --series-3: #C1EF6F;
  --grid:     #1C4A5C;
}
/* ============================================================= */

  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    color: var(--text);
    font: 16px/1.4 "Trebuchet MS", Verdana, system-ui, sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(78,95,240,.30), transparent 70%),
      linear-gradient(180deg, #0A1830 0%, var(--bg) 55%, #04070E 100%);
  }
  /* Y2K grid floor + faint scanlines */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(20,255,238,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,255,238,.055) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: linear-gradient(180deg, transparent 40%, #000 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 40%, #000 100%);
  }
  body::after {
    /* kept light — the hero number has to stay crisp from across a room */
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 3; opacity: .18;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,.35) 0 1px, transparent 1px 4px);
  }
  body > * { position: relative; z-index: 2; }

  /* ---- header ---- */
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex: none;
         padding: 9px 18px;
         background: linear-gradient(180deg, rgba(30,72,104,.92), rgba(10,26,44,.92));
         border-bottom: 2px solid transparent;
         border-image: linear-gradient(90deg, var(--aqua), var(--magenta), var(--lime)) 1;
         box-shadow: 0 0 26px rgba(20,255,238,.18); }
  #logo { height: 52px; width: auto; display: block;
          filter: drop-shadow(0 0 9px rgba(20,255,238,.55)); }
  .title { font-family: "Arial Black", Impact, system-ui, sans-serif; font-size: 21px;
           letter-spacing: .04em; line-height: 1.1; white-space: nowrap;
           background: linear-gradient(180deg, #FFFFFF 8%, #BFEFF7 42%, #14FFEE 58%, #4E9FD8 100%);
           -webkit-background-clip: text; background-clip: text; color: transparent;
           filter: drop-shadow(0 1px 0 rgba(0,0,0,.65)); }
  .title span { display: block; font-family: "Trebuchet MS", Verdana, sans-serif;
                font-size: 11px; font-weight: 700; letter-spacing: .22em; white-space: nowrap;
                background: none; -webkit-text-fill-color: var(--magenta); color: var(--magenta);
                filter: none; }
  .wordmark { font-family: "Arial Black", Impact, sans-serif; font-size: 20px;
              letter-spacing: .05em; color: var(--aqua); }
  .wordmark .sub { color: var(--magenta); font-size: 12px; letter-spacing: .18em; }
  .bar .sp { flex: 1; }
  #status { white-space: nowrap; color: var(--muted); font-size: 13px; }

  /* glossy Y2K buttons */
  button, select {
    font: inherit; font-weight: 700; color: var(--text); cursor: pointer;
    padding: 8px 14px; border-radius: 999px;
    border: 1px solid rgba(20,255,238,.5);
    background: linear-gradient(180deg, rgba(255,255,255,.24) 0%, rgba(255,255,255,.06) 48%,
                                        rgba(20,255,238,.10) 50%, rgba(4,20,32,.55) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 0 12px rgba(20,255,238,.18);
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  button:hover, select:hover { border-color: var(--magenta);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 18px rgba(230,88,179,.55); }
  select { padding-right: 8px; }

  /* ---- charts ---- */
  .top { flex: none; padding: 12px 18px 0; }
  .canvases { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  canvas { width: 100%; height: 145px; border-radius: 12px;
           background: var(--plot-bg);
           border: 1px solid rgba(20,255,238,.28);
           box-shadow: 0 0 18px rgba(20,255,238,.12), inset 0 1px 0 rgba(255,255,255,.08); }

  /* ---- hero ---- */
  .hero { flex: none; text-align: center; padding: 6px 18px 12px; }
  .hero .big {
    font-family: "Arial Black", Impact, system-ui, sans-serif;
    font-size: 122px; line-height: 1; letter-spacing: -.01em;
    background: linear-gradient(180deg, #FFFFFF 6%, #D8FFFB 34%, var(--aqua) 52%, #2FA8D8 78%, #1B6FA8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(20,255,238,.55)) drop-shadow(0 3px 0 rgba(0,0,0,.55));
  }
  .hero .unit { font-family: "Arial Black", Impact, sans-serif; font-size: 32px;
                color: var(--magenta); text-shadow: 0 0 14px rgba(230,88,179,.75); }
  .hero .sub { color: var(--muted); font-size: 17px; margin-top: 2px; min-height: 22px;
               letter-spacing: .04em; }
  .hero .best {
    display: inline-block; margin-top: 8px; padding: 7px 22px; border-radius: 999px;
    font-weight: 800; font-size: 19px; letter-spacing: .04em; color: #2A0A1E;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFC9EC 40%, var(--magenta) 55%, #A82E7E 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 0 22px rgba(230,88,179,.6);
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
  }

  /* ---- leaderboard ---- */
  .list { flex: 1; overflow-y: auto; padding: 0 18px 18px; }
  .item { display: flex; align-items: baseline; gap: 14px; padding: 10px 14px; cursor: pointer;
          font-variant-numeric: tabular-nums; border-radius: 10px; margin-bottom: 5px;
          background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
          border: 1px solid rgba(20,255,238,.16); }
  .item:hover { border-color: rgba(20,255,238,.5); box-shadow: 0 0 14px rgba(20,255,238,.2); }
  .item .rank { width: 34px; font-weight: 900; color: var(--muted); }
  .item .val  { font-family: "Arial Black", Impact, sans-serif; font-size: 26px; width: 140px;
                color: var(--aqua); text-shadow: 0 0 10px rgba(20,255,238,.5); }
  .item .meta { color: var(--muted); font-size: 14px; }
  .item.win { border-color: var(--magenta);
              background: linear-gradient(90deg, rgba(230,88,179,.26), rgba(230,88,179,.04));
              box-shadow: 0 0 22px rgba(230,88,179,.35); }
  .item.win .val { color: #FFD9F1; text-shadow: 0 0 14px rgba(230,88,179,.95); }
  .item.sel { outline: 2px solid var(--lime); outline-offset: -2px; }
  .muted { color: var(--muted); }
  .list::-webkit-scrollbar { width: 10px; }
  .list::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--aqua), var(--blue));
                                   border-radius: 999px; }
</style>
</head>
<body>
  <div class="bar">
    <img id="logo" src="assets/logo.png" alt="Red Island Beach Ultimate Tournament"
         onerror="this.style.display='none';document.getElementById('wm').style.display='block'">
    <div id="wm" class="wordmark" style="display:none">RIBUT 2026<div class="sub">DISC-O-TECH</div></div>
    <div class="title">RIBUT 2026<span>✦ DISC-O-TECH THROW TRACKER ✦</span></div>
    <span class="sp"></span>
    <span id="status">not connected</span>
    <select id="metric" title="what to rank by">
      <option value="power">Rank: POWER — max g</option>
      <option value="rpm">Rank: SPIN — max RPM</option>
      <option value="flat">Rank: FLATTEST — min °</option>
      <option value="clean">Rank: CLEANEST — min wobble</option>
    </select>
    <button id="connectBt">🎯 Connect micro:bit</button>
    <button id="connect" title="2-board radio setup">USB</button>
    <button id="export" title="download all throws">Export</button>
    <button id="reset" title="clear the leaderboard">Reset</button>
  </div>

  <div class="top">
    <div class="canvases">
      <canvas id="accCanvas" width="900" height="145"></canvas>
      <canvas id="magCanvas" width="900" height="145"></canvas>
    </div>
  </div>

  <div class="hero">
    <div><span id="big" class="big">—</span> <span id="unit" class="unit">g</span></div>
    <div id="sub" class="sub"></div>
    <div id="best" class="best">🏆 best: —</div>
  </div>

  <div id="list" class="list"></div>

<script src="../analysis/metrics.js"></script>
<script src="../analysis/plot.js"></script>
<script src="../analysis/kiosk.js"></script>
</body>
</html>
