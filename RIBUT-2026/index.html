<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIBUT 2026 · Disc-o-tech</title>
<style>
/* =============================================================
   BRANDING — the only part you need to edit to match the theme.
   1. Drop the logo in this folder as  assets/logo.png
      (transparent PNG or SVG; if it's missing the wordmark below shows instead)
   2. Replace the 5 colours with the design's hex codes.
   ============================================================= */
:root {
  --brand:      #4fa3ff;   /* main accent: big numbers, highlights   */
  --brand-2:    #b9e08a;   /* secondary accent: the winning score    */
  --bg:         #0b0e13;   /* page background                        */
  --panel:      #11161d;   /* cards / bars                           */
  --text:       #eef3f8;   /* main text                              */
  --muted:      #8a97a5;   /* labels, secondary text                 */
  --event-name: "RIBUT 2026";
}
/* ============================================================= */

  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh;
         display: flex; flex-direction: column; overflow: hidden; }

  /* ---- header / branding ---- */
  .bar { display: flex; align-items: center; gap: 14px; padding: 10px 18px;
         background: var(--panel); border-bottom: 2px solid var(--brand); flex: none; }
  #logo { height: 40px; width: auto; display: block; }
  .wordmark { font-size: 20px; font-weight: 800; letter-spacing: .06em; color: var(--brand); }
  .wordmark .sub { color: var(--muted); font-weight: 600; font-size: 13px; letter-spacing: .04em; }
  .bar .sp { flex: 1; }
  button, select { background: transparent; color: var(--text); border: 1px solid #2c3744;
                   border-radius: 8px; padding: 9px 13px; font: inherit; cursor: pointer; }
  button:hover, select:hover { border-color: var(--brand); }
  #status { color: var(--muted); font-size: 13px; }

  /* ---- graphs ---- */
  .top { flex: none; padding: 10px 18px 0; }
  .canvases { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  canvas { width: 100%; height: 145px; background: #0e1116; border-radius: 10px; }

  /* ---- hero number ---- */
  .hero { flex: none; text-align: center; padding: 4px 18px 10px; }
  .hero .big { font-size: 118px; line-height: 1; font-weight: 900; color: var(--brand);
               font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .hero .unit { font-size: 32px; color: var(--muted); font-weight: 700; }
  .hero .sub { color: var(--muted); font-size: 17px; margin-top: 4px; min-height: 22px; }
  .hero .best { display: inline-block; margin-top: 7px; padding: 6px 18px; border-radius: 999px;
                background: color-mix(in srgb, var(--brand-2) 16%, transparent);
                color: var(--brand-2); font-weight: 800; font-size: 19px; }

  /* ---- leaderboard ---- */
  .list { flex: 1; overflow-y: auto; padding: 0 18px 18px; }
  .item { display: flex; align-items: baseline; gap: 14px; padding: 10px 12px;
          border-bottom: 1px solid #161d26; font-variant-numeric: tabular-nums; cursor: pointer; }
  .item:hover { background: #131a23; }
  .item .rank { width: 32px; color: #66798a; font-weight: 800; }
  .item .val  { font-size: 27px; font-weight: 800; width: 135px; }
  .item .meta { color: var(--muted); font-size: 14px; }
  .item.win { background: linear-gradient(90deg, color-mix(in srgb, var(--brand-2) 14%, transparent), transparent); }
  .item.win .val { color: var(--brand-2); }
  .item.sel { outline: 2px solid var(--brand); outline-offset: -2px; border-radius: 8px; }
  .muted { color: #66798a; }
</style>
</head>
<body>
  <div class="bar">
    <img id="logo" src="assets/logo.png" alt=""
         onerror="this.style.display='none';document.getElementById('wm').style.display='block'">
    <div id="wm" class="wordmark" style="display:none">RIBUT 2026<div class="sub">DISC-O-TECH</div></div>
    <span class="sp"></span>
    <span id="status">not connected</span>
    <select id="metric" title="what to rank by">
      <option value="power">Rank: POWER — max g</option>
      <option value="rpm">Rank: SPIN — max RPM</option>
      <option value="flat">Rank: FLATTEST — min °</option>
      <option value="clean">Rank: CLEANEST — min wobble</option>
    </select>
    <button id="connectBt">🎯 Connect micro:bit</button>
    <button id="connect" title="2-board radio setup">USB</button>
    <button id="export" title="download all throws">Export</button>
    <button id="reset" title="clear the leaderboard">Reset</button>
  </div>

  <div class="top">
    <div class="canvases">
      <canvas id="accCanvas" width="900" height="145"></canvas>
      <canvas id="magCanvas" width="900" height="145"></canvas>
    </div>
  </div>

  <div class="hero">
    <div><span id="big" class="big">—</span> <span id="unit" class="unit">g</span></div>
    <div id="sub" class="sub"></div>
    <div id="best" class="best">🏆 best: —</div>
  </div>

  <div id="list" class="list"></div>

<script src="../analysis/metrics.js"></script>
<script src="../analysis/plot.js"></script>
<script src="../analysis/kiosk.js"></script>
</body>
</html>
