<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disc-o-tech · Leaderboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #0b0e13; color: #eef3f8;
         height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #1c232c; flex: none; }
  .bar h1 { margin: 0; font-size: 16px; color: #8a97a5; font-weight: 700; letter-spacing: .04em; }
  .bar .sp { flex: 1; }
  button, select { background: #1b2531; color: #eef3f8; border: 1px solid #2c3744; border-radius: 8px;
                   padding: 9px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: #4fa3ff; }
  #status { color: #8a97a5; font-size: 13px; }
  .top { flex: none; padding: 8px 16px 0; }
  canvas { width: 100%; height: 150px; background: #0e1116; border-radius: 8px; }
  .canvases { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hero { flex: none; text-align: center; padding: 6px 16px 10px; }
  .hero .big { font-size: 110px; line-height: 1; font-weight: 800; color: #4fa3ff; font-variant-numeric: tabular-nums; }
  .hero .unit { font-size: 30px; color: #8a97a5; font-weight: 700; }
  .hero .sub { color: #9fb0c0; font-size: 18px; margin-top: 4px; min-height: 22px; }
  .hero .best { display: inline-block; margin-top: 6px; padding: 5px 14px; border-radius: 999px;
                background: #1f2a1a; color: #b9e08a; font-weight: 700; font-size: 18px; }
  .list { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
  .item { display: flex; align-items: baseline; gap: 12px; padding: 9px 12px; border-bottom: 1px solid #161d26;
          font-variant-numeric: tabular-nums; }
  .item .rank { width: 30px; color: #66798a; font-weight: 700; }
  .item .val { font-size: 26px; font-weight: 800; width: 130px; }
  .item .meta { color: #8a97a5; font-size: 14px; }
  .item.win { background: linear-gradient(90deg,#1f2a1a,transparent); }
  .item.win .val { color: #b9e08a; }
  .muted { color: #66798a; }
</style>
</head>
<body>
  <div class="bar">
    <h1>🥏 DISC-O-TECH</h1>
    <span class="sp"></span>
    <span id="status">not connected</span>
    <select id="metric" title="what to rank by">
      <option value="power">Rank: POWER (g)</option>
      <option value="rpm">Rank: SPIN (RPM)</option>
    </select>
    <button id="connect">Connect (USB)</button>
    <button id="connectBt">Bluetooth</button>
    <button id="export" title="download all throws (re-loadable, includes raw data)">Export</button>
    <button id="reset" title="clear the leaderboard">Reset</button>
  </div>

  <div class="top">
    <div class="canvases">
      <canvas id="accCanvas" width="900" height="150"></canvas>
      <canvas id="magCanvas" width="900" height="150"></canvas>
    </div>
  </div>

  <div class="hero">
    <div><span id="big" class="big">—</span> <span id="unit" class="unit">g</span></div>
    <div id="sub" class="sub"></div>
    <div id="best" class="best">🏆 best: —</div>
  </div>

  <div id="list" class="list"></div>

<script src="metrics.js"></script>
<script src="plot.js"></script>
<script src="kiosk.js"></script>
</body>
</html>
